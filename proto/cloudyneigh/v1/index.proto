syntax = "proto3";

package cloudyneigh.v1;

option go_package = "github.com/iampat/cloudy-neigh/proto/cloudyneigh/v1;cloudyneighpb";

message Vector {
  repeated float values = 1;
}

message AttributeValue {
  oneof value {
    string string_value = 1;
    // int64 int_value = 2;
    // double float_value = 3;
    // bool bool_value = 4;
    // bytes bytes_value = 5;
  }
}

message Record {
  string id = 1;
  map<string, Vector> vectors = 2;
  map<string, AttributeValue> attributes = 3;
}

message UpsertRequest {
  string namespace = 1;
  repeated Record records = 2;
  string branch = 3;
}

message UpsertResponse {
  uint32 upserted_count = 1;
}

message DeleteRequest {
  string namespace = 1;
  repeated string ids = 2;
  string branch = 3;
}

message DeleteResponse {
  uint32 deleted_count = 1;
}

message EqualityFilter {
  string field = 1;
  AttributeValue value = 2;
}

enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  DISTANCE_METRIC_COSINE = 1;
  DISTANCE_METRIC_EUCLIDEAN_SQUARED = 2;
  DISTANCE_METRIC_DOT_PRODUCT = 3;
}

message QueryRequest {
  string namespace = 1;
  repeated float vector = 2;
  uint32 top_k = 3;
  EqualityFilter filter = 4;
  string vector_column = 5;
  string branch = 6;
}

message ScoredRecord {
  Record record = 1;
  float score = 2;
}

message QueryResponse {
  repeated ScoredRecord hits = 1;
}

message ForkRequest {
  string namespace = 1;
  string source_branch = 2;
  string target_branch = 3;
}

message ForkResponse {}

service IngestService {
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Fork(ForkRequest) returns (ForkResponse);
}

service QueryService {
  rpc Query(QueryRequest) returns (QueryResponse);
}
