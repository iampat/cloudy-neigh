syntax = "proto3";

package kvfs.v1;

option go_package = "github.com/iampat/cloudy-neigh/proto/kvfs/v1;kvfspb";

message ManifestEntry {
  string blob_hash = 1;
  uint64 size_bytes = 2;
}

message Manifest {
  uint64 last_wal_seq = 1;
  map<string, ManifestEntry> entries = 2;
}

message Mutation {
  string key = 1;
  string blob_hash = 2;
  uint64 size_bytes = 3;
  bool tombstone = 4;
}
