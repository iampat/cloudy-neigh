syntax = "proto3";

package cloudyneigh.storage.v1;

option go_package = "github.com/iampat/cloudy-neigh/proto/storage/v1;storagepb";

enum MutationOp {
  MUTATION_OP_UNSPECIFIED = 0;
  PUT = 1;
  DELETE = 2;
}

message DocumentMutation {
  string branch = 1;
  string doc_id = 2;
  MutationOp op = 3;
  bytes payload = 4;
}

message BranchLifecycleEvent {
  enum Type {
    UNSPECIFIED = 0;
    FORK = 1;
    // DELETE = 2;
  }
  Type type = 1;
  string branch = 2;
  string parent_branch = 3;
}

message WalRecord {
  oneof record {
    DocumentMutation mutation = 1;
    BranchLifecycleEvent branch_event = 2;
  }
}

message SegmentRef {
  string segment_id = 1;
  uint64 doc_count = 4;
  int64 docs_size = 8;
}

message BranchManifest {
  uint64 checkpoint_seq = 1;
  uint64 schema_version = 2;
  repeated SegmentRef segments = 3;
}

