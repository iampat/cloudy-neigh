name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [ go1.26 ]
    steps:
    - uses: actions/checkout@v7
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.go }}
        repository-cache: true

    - name: Build
      run: bazel build --config=${{ matrix.go }} //...

    - name: Test (race)
      run: bazel test --config=${{ matrix.go }} --config=race //...

    - name: Benchmark
      run: bazel test --config=${{ matrix.go }} --test_output=all --test_arg=-test.v --test_arg=-test.bench=. --test_arg=-test.cpu=1 //...

  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        go: [ go1.27 ]
    steps:
    - uses: actions/checkout@v7
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.go }}
        repository-cache: true

    - name: Build
      run: bazel build --config=${{ matrix.go }} //...

    - name: Test (race)
      run: bazel test --config=${{ matrix.go }} --config=race //...

    - name: Benchmark
      run: bazel test --config=${{ matrix.go }} --test_output=all --test_arg=-test.v --test_arg=-test.bench=. --test_arg=-test.cpu=1 //...

  # Branch protection requires the literal context "build-test". A matrix job
  # publishes "build (go1.26)", so this reports the required name and stays
  # stable as the matrix changes. It excludes canary, which is allowed to fail.
  build-test:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
    - run: test "${{ needs.build.result }}" = success
