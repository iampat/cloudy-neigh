name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Build
      run: bazel build //...

    - name: Test (race)
      run: bazel test --config=race //...

    - name: Benchmark
      run: bazel test --test_output=all --test_arg=-test.v --test_arg=-test.bench=. --test_arg=-test.cpu=1 //...

  # Branch protection requires the literal context "build-test". It stays
  # stable as jobs change.
  build-test:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
    - run: test "${{ needs.build.result }}" = success
