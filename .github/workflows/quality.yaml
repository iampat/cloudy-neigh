name: Quality
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    # The job always reports, because `quality` is a required check. A
    # `paths-ignore` filter would leave that check pending forever on a pull
    # request that changes no code.
    - name: Find code changes
      id: changes
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
          | grep -qvE '\.md$|^docs/|^LICENSE$'; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "No code changed. The checks below do not run." >> "$GITHUB_STEP_SUMMARY"
        fi

    - uses: bazel-contrib/setup-bazel@0.19.0
      if: steps.changes.outputs.code == 'true'
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Format check
      if: steps.changes.outputs.code == 'true'
      run: bazel run //:format.check

    - name: go mod verify
      if: steps.changes.outputs.code == 'true'
      run: bazel run @io_bazel_rules_go//go -- mod verify

    - name: govulncheck
      if: steps.changes.outputs.code == 'true'
      continue-on-error: true
      run: bazel run @io_bazel_rules_go//go -- run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

    - name: golangci-lint
      if: steps.changes.outputs.code == 'true'
      continue-on-error: true
      run: bazel run @io_bazel_rules_go//go -- run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} run ./...
